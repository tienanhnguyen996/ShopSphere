name: Deploy ShopSphere to GCP Dev

on:
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: 'Run Terraform Apply (provisions or updates Cloud SQL, Redis, Cloud Run, etc.)'
        required: true
        type: boolean
        default: true
      deploy_containers:
        description: 'Build & deploy all microservice containers, gateway, and Web SPA'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
  GAR_REPO: shopsphere-containers-dev
  TF_STATE_BUCKET: ${{ secrets.GCP_TF_STATE_BUCKET }}

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Check formatting and lint
        run: |
          bash scripts/lint.sh

      - name: Run Unit Tests
        run: |
          dotnet test --filter "Category!=Integration" --configuration Release

  terraform-plan-apply:
    name: Terraform Plan & Apply
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive deploy/terraform/gcp/

      - name: Terraform Init & Plan
        working-directory: deploy/terraform/gcp/environments/dev
        run: |
          terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"
          terraform validate
          terraform plan -var="project_id=${{ env.PROJECT_ID }}" -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.apply_terraform == 'true' || github.event.inputs.apply_terraform == true
        working-directory: deploy/terraform/gcp/environments/dev
        run: |
          terraform apply -auto-approve tfplan

  build-and-deploy:
    name: Build Containers & Deploy to Cloud Run
    needs: terraform-plan-apply
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_containers == true || github.event.inputs.deploy_containers == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Gateway Container
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/gateway:${{ github.sha }}"
          LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/gateway:latest"
          docker build -t "$IMAGE" -t "$LATEST" -f deploy/docker/Dockerfile.gateway .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Build & Push Microservices
        run: |
          declare -A services=(
            ["catalog"]="src/Services/Catalog:src/Services/Catalog/Catalog.Api/Catalog.Api.csproj:Catalog.Api.dll"
            ["cart"]="src/Services/Cart:src/Services/Cart/Cart.Api/Cart.Api.csproj:Cart.Api.dll"
            ["identity"]="src/Services/Identity:src/Services/Identity/Identity.Api/Identity.Api.csproj:Identity.Api.dll"
            ["inventory"]="src/Services/Inventory:src/Services/Inventory/Inventory.Api/Inventory.Api.csproj:Inventory.Api.dll"
            ["payment"]="src/Services/Payment:src/Services/Payment/Payment.Api/Payment.Api.csproj:Payment.Api.dll"
            ["order"]="src/Services/Order:src/Services/Order/Order.Api/Order.Api.csproj:Order.Api.dll"
            ["shipping"]="src/Services/Shipping:src/Services/Shipping/Shipping.Api/Shipping.Api.csproj:Shipping.Api.dll"
            ["notification"]="src/Services/Notification:src/Services/Notification/Notification.Api/Notification.Api.csproj:Notification.Api.dll"
          )
          for svc in "${!services[@]}"; do
            IFS=':' read -r dir proj dll <<< "${services[$svc]}"
            echo "Building $svc container..."
            IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${svc}:${{ github.sha }}"
            LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${svc}:latest"
            docker build \
              --build-arg SERVICE_DIR="${dir}" \
              --build-arg PROJECT_PATH="${proj}" \
              --build-arg DLL_NAME="${dll}" \
              -t "$IMAGE" -t "$LATEST" -f deploy/docker/Dockerfile.service .
            docker push "$IMAGE"
            docker push "$LATEST"
          done

      - name: Update Cloud Run Services
        run: |
          for svc in gateway catalog cart identity inventory payment order shipping notification; do
            echo "Updating Cloud Run service ${svc}-dev..."
            gcloud run deploy "${svc}-dev" \
              --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${svc}:${{ github.sha }}" \
              --region="${{ env.REGION }}" \
              --quiet || true
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Build & Deploy Frontend Web SPA
        run: |
          cd src/Web
          pnpm install --frozen-lockfile
          pnpm build
          gcloud storage rsync dist/ "gs://shopsphere-spa-dev-${{ env.PROJECT_ID }}" --recursive --delete-unmatched-destination-objects
