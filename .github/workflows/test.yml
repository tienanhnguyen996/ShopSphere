name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - "LICENSE"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'ShopSphere.sln'
              - '.github/workflows/test.yml'
            web:
              - 'src/Web/**'
              - 'docs/specs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/test.yml'

  test-dotnet:
    name: .NET Tests (Unit & Integration)
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build tests
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/BuildingBlocks.Tests.Unit/BuildingBlocks.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
          dotnet test tests/Catalog.Tests.Unit/Catalog.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
          dotnet test tests/Cart.Tests.Unit/Cart.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
          dotnet test tests/Inventory.Tests.Unit/Inventory.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
          dotnet test tests/Payment.Tests.Unit/Payment.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
          dotnet test tests/Gateway.Tests.Unit/Gateway.Tests.Unit.csproj --no-build --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/Catalog.Tests.Integration/Catalog.Tests.Integration.csproj --no-build --configuration Release --verbosity normal

  test-web:
    name: Frontend Web Typecheck & Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install

      - name: Run Web Tests
        run: pnpm --dir src/Web test

      - name: Typecheck and Build Web
        run: pnpm --dir src/Web build

  test-status:
    name: Tests Status
    needs: [changes, test-dotnet, test-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
