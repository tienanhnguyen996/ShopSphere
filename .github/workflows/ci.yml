name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore || echo "No .NET projects yet"

      - name: Build
        run: dotnet build --no-restore --configuration Release || echo "No .NET projects yet"

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal || echo "No tests yet"

  devcontainer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            dotnet --version
            node --version
            docker --version
            echo "✅ Dev container builds successfully"
